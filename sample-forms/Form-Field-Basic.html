<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Component Prototype</title>
    <style>
        /* Presentation Styling */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            padding: 2rem;
            color: #27272a;
        }
        .journey-container {
            background-color: #ffffff;
            border: 2px solid #e4e4e7;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .journey-header {
            border-bottom: 2px dashed #d4d4d8;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; }
        h2 { margin: 0 0 1rem 0; font-size: 1.25rem; color: #52525b; }
        h3 { margin: 0 0 1rem 0; font-size: 1.1rem; color: #0284c7; }
        
        /* Form Field Styling */
        .field-group {
            margin-bottom: 1.25rem;
            padding: 1rem;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            border-radius: 6px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d4d4d8;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .radio-group label, .checkbox-group label {
            font-weight: normal;
            margin-bottom: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Adaptive Child Form Styling */
        .child-form {
            margin-top: 1rem;
            padding: 1.5rem;
            background-color: #f0f9ff;
            border: 2px solid #7dd3fc;
            border-radius: 8px;
            display: none; /* Hidden by default */
            transition: all 0.3s ease;
        }
        .child-form.active {
            display: block;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        button.submit-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            margin-top: 1rem;
        }
        button.submit-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="journey-container">
        <div class="journey-header">
            <h1>User Journey</h1>
            <p style="margin: 0; color: #71717a; font-size: 0.9rem;">Page 1 of 3: Initial Data Collection</p>
        </div>

        <form id="presentation-form" onsubmit="event.preventDefault(); alert('Form Data Ready for Backend!');">
            <h2>Primary Form</h2>

            <div class="field-group">
                <label for="username">Username (String)</label>
                <input type="text" id="username" placeholder="Enter username..." />
            </div>

            <div class="field-group">
                <label>Preferred Contact Method (Radio)</label>
                <div class="radio-group">
                    <label><input type="radio" name="contact" value="email" checked> Email</label>
                    <label><input type="radio" name="contact" value="sms"> SMS</label>
                </div>
            </div>

            <div class="field-group" style="border-color: #0284c7; background-color: #f8fafc;">
                <label for="service-type">Service Required (Dynamic Trigger)</label>
                <select id="service-type" onchange="handleRuleEvaluation()">
                    <option value="standard">Standard Service</option>
                    <option value="premium">Premium Service</option>
                    <option value="custom">Custom Configuration (Triggers Child Form)</option>
                </select>
                <p style="font-size: 0.8rem; color: #64748b; margin: 0.5rem 0 0 0;">*Selecting 'Custom' evaluates a rule and renders an adaptive child form.</p>
            </div>

            <div id="dynamic-child-form" class="child-form">
                <h3>↳ Child Form (from Options)</h3>
                <p style="font-size: 0.85rem; color: #0369a1; margin-top: 0; margin-bottom: 1rem;">
                    This component only mounts if the 'Custom' option is selected, representing your FE/BE contract.
                </p>

                <div class="field-group" style="background-color: rgba(255,255,255,0.7);">
                    <label for="custom-details">Configuration Details (Text Area)</label>
                    <textarea id="custom-details" rows="3" placeholder="Describe your custom requirements..."></textarea>
                </div>

                <div class="field-group" style="background-color: rgba(255,255,255,0.7); margin-bottom: 0;">
                    <label>Additional Options (Checkbox)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="express"> Express Processing</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Journey Data</button>
        </form>
    </div>

    <script>
        // Simulating the dynamic rules you sketched in your notes
        function handleRuleEvaluation() {
            const dropdown = document.getElementById('service-type');
            const childForm = document.getElementById('dynamic-child-form');
            
            // The Rule: If option === 'custom', render the child form
            if (dropdown.value === 'custom') {
                childForm.classList.add('active');
            } else {
                childForm.classList.remove('active');
            }
        }
    </script>

</body>
</html>
