<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Journey Component</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            padding: 2rem;
            color: #27272a;
        }
        .journey-container {
            background-color: #ffffff;
            border: 2px solid #e4e4e7;
            border-radius: 12px;
            padding: 2rem;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-top: 0; color: #18181b; }
        
        .field-group {
            margin-bottom: 1.25rem;
            padding: 1rem;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            border-radius: 6px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d4d4d8;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Adaptive Form Container */
        #adaptive-container {
            display: none; /* Hidden until triggered */
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
            border-radius: 8px;
        }

        /* The Nested Child Form itself */
        .child-form-instance {
            background-color: #ffffff;
            border: 1px solid #bbf7d0;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 6px;
            position: relative;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* The little button on the child form */
        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .remove-btn:hover {
            background-color: #fecaca;
        }

        /* The Add Button at the bottom */
        .add-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .add-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="journey-container">
        <h2>Component Structure Demo</h2>

        <!-- Trigger Field -->
        <div class="field-group">
            <label for="trigger-field">Select Option (Trigger)</label>
            <select id="trigger-field" onchange="checkTrigger(this)">
                <option value="default">Standard Single Form</option>
                <option value="dynamic">Enable Adaptive Child Forms</option>
            </select>
        </div>

        <!-- Adaptive Child Form Area -->
        <div id="adaptive-container">
            <h3 style="margin-top: 0; color: #166534; font-size: 1.1rem;">↳ Adaptive Child Form Region</h3>
            <p style="font-size: 0.85rem; color: #15803d; margin-bottom: 1rem;">
                This structure dynamically changes. The user can add as many sub-forms as they need.
            </p>

            <!-- Wrapper where new forms get injected -->
            <div id="child-forms-wrapper"></div>

            <!-- The Add Button -->
            <button type="button" class="add-btn" onclick="addChildForm()">
                + Add Another Child Form
            </button>
        </div>

    </div>

    <script>
        let formCounter = 0;

        // Shows or hides the whole adaptive section based on dropdown
        function checkTrigger(selectElement) {
            const container = document.getElementById('adaptive-container');
            const wrapper = document.getElementById('child-forms-wrapper');
            
            if (selectElement.value === 'dynamic') {
                container.style.display = 'block';
                // Automatically add the first child form when opened
                if(wrapper.children.length === 0) {
                    addChildForm();
                }
            } else {
                container.style.display = 'none';
                // Optional: Clear out forms if user changes their mind
                wrapper.innerHTML = '';
                formCounter = 0;
            }
        }

        // Adds a new nested form
        function addChildForm() {
            formCounter++;
            const wrapper = document.getElementById('child-forms-wrapper');
            
            // Create the new child form element
            const newForm = document.createElement('div');
            newForm.className = 'child-form-instance';
            newForm.id = 'child-form-' + formCounter;
            
            // Inject the HTML for the fields AND the little remove button
            newForm.innerHTML = `
                <button type="button" class="remove-btn" onclick="removeForm('${newForm.id}')">✕ Remove</button>
                <label>Child Form #${formCounter} Data</label>
                <input type="text" placeholder="Enter specific data for this child form..." style="margin-bottom: 0.5rem;" />
                <select>
                    <option>String Type</option>
                    <option>Number Type</option>
                </select>
            `;
            
            // Append it to the structure
            wrapper.appendChild(newForm);
        }

        // The little button function to simulate structural changes
        function removeForm(formId) {
            const formToRemove = document.getElementById(formId);
            if(formToRemove) {
                formToRemove.remove();
            }
        }
    </script>
</body>
</html>
