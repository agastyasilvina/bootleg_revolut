<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Options Component</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            padding: 2rem;
            color: #27272a;
        }
        .journey-container {
            background-color: #ffffff;
            border: 2px solid #e4e4e7;
            border-radius: 12px;
            padding: 2rem;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-top: 0; color: #18181b; }
        
        .field-group {
            margin-bottom: 1.25rem;
            padding: 1rem;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            border-radius: 6px;
        }
        .bg-highlight {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            border-left: 4px solid #3b82f6;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #d4d4d8;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .checkbox-label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: #fff;
            border: 1px solid #e4e4e7;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .checkbox-label.newly-added {
            background-color: #eff6ff;
            border-color: #bfdbfe;
            animation: fadeIn 0.4s ease-out;
        }

        /* Adaptive Child Form */
        .child-form {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: #f0fdf4;
            border: 2px dashed #4ade80;
            border-radius: 8px;
        }
        .child-form.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        /* Buttons */
        .btn {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }

        @keyframes fadeIn {
            from { opacity: 0; background-color: #dbeafe; }
            to { opacity: 1; background-color: #eff6ff; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="journey-container">
        <h2>Dynamic Options Engine</h2>
        
        <div class="field-group bg-highlight">
            <label>1. Simulate Incoming Submission Data</label>
            <p style="font-size: 0.85rem; color: #475569; margin-top: 0;">
                Type a value and click 'Add Option' to simulate the system generating a dynamic choice based on previous data.
            </p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="simulated-data-input" placeholder="e.g., Extra Server Instance">
                <button type="button" class="btn btn-primary" onclick="injectDynamicOption()">Add Option</button>
            </div>
        </div>

        <div class="field-group">
            <label>2. Available Options (Checkbox Array)</label>
            <div id="options-container">
                <label class="checkbox-label">
                    <input type="checkbox" value="standard" onchange="evaluateRules()">
                    Standard Base Package (Static)
                </label>
            </div>
        </div>

        <div id="adaptive-child-form" class="child-form">
            <h3 style="margin-top: 0; color: #166534; font-size: 1.1rem;">↳ Required Configuration</h3>
            <p style="font-size: 0.85rem; color: #15803d; margin-bottom: 1rem;">
                This child form has appeared because a dynamically generated option was selected.
            </p>
            <label>Configuration Details</label>
            <textarea rows="3" placeholder="Enter specific data for the selected dynamic option(s)..."></textarea>
        </div>

    </div>

    <script>
        let optionCounter = 0;

        // Function to inject a new option into the array based on "submission data"
        function injectDynamicOption() {
            const inputField = document.getElementById('simulated-data-input');
            const dataValue = inputField.value.trim();
            
            if (!dataValue) return; // Prevent empty additions

            optionCounter++;
            const container = document.getElementById('options-container');
            
            // Create the UI elements for the new option
            const newLabel = document.createElement('label');
            newLabel.className = 'checkbox-label newly-added';
            
            const newCheckbox = document.createElement('input');
            newCheckbox.type = 'checkbox';
            newCheckbox.value = 'dynamic_opt_' + optionCounter;
            
            // Core Logic: Tag this specific checkbox as one that triggers the child form
            newCheckbox.dataset.triggersChildForm = "true";
            
            // Attach the evaluation rule to the new checkbox
            newCheckbox.onchange = evaluateRules;

            // Assemble and inject
            newLabel.appendChild(newCheckbox);
            newLabel.appendChild(document.createTextNode(' ' + dataValue + ' (Dynamic Option)'));
            container.appendChild(newLabel);
            
            // Reset the input field
            inputField.value = '';
        }

        // Evaluates the state of all checkboxes to see if the child form should render
        function evaluateRules() {
            const container = document.getElementById('options-container');
            const childForm = document.getElementById('adaptive-child-form');
            const allCheckboxes = container.querySelectorAll('input[type="checkbox"]');
            
            let requiresChildForm = false;
            
            // Check if any currently ticked box carries the trigger data attribute
            allCheckboxes.forEach(checkbox => {
                if (checkbox.checked && checkbox.dataset.triggersChildForm === "true") {
                    requiresChildForm = true;
                }
            });

            // Toggle visibility of the child form
            if (requiresChildForm) {
                childForm.classList.add('active');
            } else {
                childForm.classList.remove('active');
            }
        }
    </script>

</body>
</html>
