spring:
  application:
    name: bootleg-revolut

  data:
    redis:
      host: localhost   # or the Docker container hostname if different
      port: 6379

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/bootleg
    username: bootleg
    password: bootleg

  reactor:
    context-propagation: auto


server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always


obs:
  runtime:
    session-ttl: PT30M


management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP HTTP endpoint (commonly 4318). Change to your collector/backend.
          endpoint: http://localhost:4318/v1/traces

# Optional: make logs clearly show traceId/spanId (Spring Boot can include correlation IDs by default)
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
